<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>U.S. History Jeopardy #1</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: navy;
      color: gold;
      text-align: center;
    }
 
table {
  margin: auto;
  border-collapse: collapse;
  table-layout: fixed;   /* forces equal column widths */
  width: 90%;            /* keeps it nicely centered */
}

th {
  border: 2px solid white;
  width: 20%;
  height: 90px;
  padding: 15px;
  background: #001a66;       /* dark heading blue */
  color: white;
  font-size: 18px;
  box-sizing: border-box;
}

td {
  border: 2px solid white;
  width: 20%;
  height: 90px;
  padding: 20px;
  background: #0059ff;       /* BRIGHT blue for number boxes */
  color: gold;
  cursor: pointer;
  font-size: 26px;
  font-weight: bold;
  box-sizing: border-box;
}
``

    th {
      background: #000066;
      color: white;
    }

    td.used {
      background: black;
      cursor: default;
    }

    #questionBox {
      display: none;
      margin-top: 40px;
      font-size: 30px;
    }

  button {
  background: gold;
  color: navy;
  border: none;
  padding: 10px 18px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  border-radius: 6px;
}

button:hover {
  background: #ffd700;
}
  </style>
</head>

<body>

<h1>U.S. History Review – Jeopardy #1</h1>
<button onclick="resetGame()">Reset Game</button>

<table>
  <tr>
    <th>American Independence</th>
    <th>Westward Expansion</th>
    <th>Industrialization</th>
    <th>Constitution</th>
    <th>Civil War</th>
  </tr>

  <tr>
    <td onclick="showQ(0, this)">100</td>
    <td onclick="showQ(1, this)">100</td>
    <td onclick="showQ(2, this)">100</td>
    <td onclick="showQ(3, this)">100</td>
    <td onclick="showQ(4, this)">100</td>
  </tr>

  <tr>
    <td onclick="showQ(5, this)">200</td>
    <td onclick="showQ(6, this)">200</td>
    <td onclick="showQ(7, this)">200</td>
    <td onclick="showQ(8, this)">200</td>
    <td onclick="showQ(9, this)">200</td>
  </tr>

  <tr>
    <td onclick="showQ(10, this)">300</td>
    <td onclick="showQ(11, this)">300</td>
    <td onclick="showQ(12, this)">300</td>
    <td onclick="showQ(13, this)">300</td>
    <td onclick="showQ(14, this)">300</td>
  </tr>

  <tr>
    <td onclick="showQ(15, this)">400</td>
    <td onclick="showQ(16, this)">400</td>
    <td onclick="showQ(17, this)">400</td>
    <td onclick="showQ(18, this)">400</td>
    <td onclick="showQ(19, this)">400</td>
  </tr>
</table>

<div id="questionBox">
  <div id="qText"></div>
  <div id="aText" style="display:none;"></div>
  <button onclick="showA()">Show Answer</button>
  <button onclick="closeQ()">Close</button>
</div>

<script>
const data = [
  { q:"Writer of the Declaration of Independence", a:"Who is Thomas Jefferson?" },
  { q:"The idea that the U.S. should expand from the Atlantic to the Pacific", a:"What is Manifest Destiny?" },
  { q:"When one company controls an industry", a:"What is a monopoly?" },
  { q:"The first plan of government that gave more power to the states", a:"What are the Articles of Confederation?" },
  { q:"The belief in ending slavery", a:"What is abolitionism?" },

  { q:"The war that caused Britain to tax the colonies", a:"What is the French and Indian War?" },
  { q:"The port city gained in the Louisiana Purchase", a:"What is New Orleans?" },
  { q:"Government should not interfere in business", a:"What is laissez-faire?" },
  { q:"Group demanding a Bill of Rights", a:"Who were the Anti-Federalists?" },
  { q:"Supreme Court case allowing slavery in territories", a:"What is Dred Scott v. Sanford?" },

  { q:"Colonists’ slogan protesting British taxes", a:"No taxation without representation" },
  { q:"Forced relocation of the Cherokee people", a:"What is the Trail of Tears?" },
  { q:"Immigrants from Southern & Eastern Europe", a:"Who were the new immigrants?" },
  { q:"Result of the Great Compromise", a:"What is a bicameral legislature?" },
  { q:"How many former slaves made a living after the war", a:"What is sharecropping?" },

  { q:"Three natural rights in the Declaration", a:"Life, liberty, and the pursuit of happiness" },
  { q:"Territory added in 1803", a:"What is the Louisiana Territory?" },
  { q:"Business practice to eliminate competitors", a:"What is predatory pricing?" },
  { q:"Compromise on representation in Congress", a:"What is the Great Compromise?" },
  { q:"Main cause of the Civil War", a:"What is slavery?" }
];

let currentCell = null;

function showQ(i, cell) {
  currentCell = cell;
  document.getElementById("qText").innerText = data[i].q;
  document.getElementById("aText").innerText = data[i].a;
  document.getElementById("aText").style.display = "none";
  document.getElementById("questionBox").style.display = "block";
}

function showA() {
  document.getElementById("aText").style.display = "block";
}

function closeQ() {
  document.getElementById("questionBox").style.display = "none";
  if (currentCell) {
    currentCell.classList.add("used");
    currentCell.onclick = null;
  }
}
function resetGame() {
  const cells = document.querySelectorAll("td");
  cells.forEach(cell => {
    cell.classList.remove("used");
    cell.onclick = null;
  });

  // Reattach click handlers
  let index = 0;
  cells.forEach(cell => {
    if (cell.innerText.match(/^\d+$/)) {
      cell.onclick = function () {
        showQ(index, cell);
      };
      index++;
    }
  });
}
</script>

</body>
</html>
