<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>U.S. History Jeopardy #3</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: navy;
  color: gold;
  text-align: center;
}

table {
  margin: auto;
  border-collapse: collapse;
  table-layout: fixed;
  width: 90%;
}

th {
  border: 2px solid white;
  width: 20%;
  height: 90px;
  padding: 15px;
  background: #001a66;
  color: white;
  font-size: 18px;
  box-sizing: border-box;
}

td {
  border: 2px solid white;
  width: 20%;
  height: 90px;
  padding: 20px;
  background: #0059ff;
  color: gold;
  cursor: pointer;
  font-size: 26px;
  font-weight: bold;
  box-sizing: border-box;
}

td.used { background: black; cursor: default; }
td:hover { background: #3380ff; }

#questionBox {
  display: none;
  margin-top: 40px;
  font-size: 30px;
}

button { font-size: 18px; margin: 15px; }
</style>
</head>

<body>

<h1>U.S. History Review – Jeopardy #3</h1>

<table>
<tr>
  <th>Colonial America</th>
  <th>Bill of Rights</th>
  <th>Presidents</th>
  <th>Amendments</th>
  <th>Geography</th>
</tr>

<tr>
  <td onclick="showQ(0,this)">100</td>
  <td onclick="showQ(1,this)">100</td>
  <td onclick="showQ(2,this)">100</td>
  <td onclick="showQ(3,this)">100</td>
  <td onclick="showQ(4,this)">100</td>
</tr>

<tr>
  <td onclick="showQ(5,this)">200</td>
  <td onclick="showQ(6,this)">200</td>
  <td onclick="showQ(7,this)">200</td>
  <td onclick="showQ(8,this)">200</td>
  <td onclick="showQ(9,this)">200</td>
</tr>

<tr>
  <td onclick="showQ(10,this)">300</td>
  <td onclick="showQ(11,this)">300</td>
  <td onclick="showQ(12,this)">300</td>
  <td onclick="showQ(13,this)">300</td>
  <td onclick="showQ(14,this)">300</td>
</tr>

<tr>
  <td onclick="showQ(15,this)">400</td>
  <td onclick="showQ(16,this)">400</td>
  <td onclick="showQ(17,this)">400</td>
  <td onclick="showQ(18,this)">400</td>
  <td onclick="showQ(19,this)">400</td>
</tr>
</table>

<div id="questionBox">
  <div id="qText"></div>
  <div id="aText" style="display:none;"></div>
  <button onclick="showA()">Show Answer</button>
  <button onclick="closeQ()">Close</button>
</div>

<script>
const data = [
 {q:"First permanent English settlement",a:"What is Jamestown?"},
 {q:"Freedom of speech and religion",a:"What is the First Amendment?"},
 {q:"President who bought Louisiana",a:"Who is Thomas Jefferson?"},
 {q:"Guarantees equal protection",a:"What is the 14th Amendment?"},
 {q:"Large flat region in the center of the U.S.",a:"What are the Great Plains?"},

 {q:"British policy for colonial trade",a:"What is mercantilism?"},
 {q:"Protection against self-incrimination",a:"What is the Fifth Amendment?"},
 {q:"President who built the Panama Canal",a:"Who is Theodore Roosevelt?"},
 {q:"Granted women voting rights",a:"What is the 19th Amendment?"},
 {q:"City divided after WWII",a:"What is Berlin?"},

 {q:"British practice of ignoring colonies",a:"What is salutary neglect?"},
 {q:"Right to an attorney",a:"What is the Sixth Amendment?"},
 {q:"President linked to Indian Removal",a:"Who is Andrew Jackson?"},
 {q:"Banned poll taxes",a:"What is the 24th Amendment?"},
 {q:"Territory split with Britain in 1846",a:"What is Oregon?"},

 {q:"Colonists seeking religious freedom",a:"Who were the Pilgrims?"},
 {q:"Protects the right to bear arms",a:"What is the Second Amendment?"},
 {q:"President during the Civil War",a:"Who is Abraham Lincoln?"},
 {q:"Ended slavery",a:"What is the 13th Amendment?"},
 {q:"River forming the western border of early U.S.",a:"What is the Mississippi River?"}
];

let cell=null;
function showQ(i,c){cell=c; qText.innerText=data[i].q; aText.innerText=data[i].a;
aText.style.display="none"; questionBox.style.display="block";}
function showA(){aText.style.display="block";}
function closeQ(){questionBox.style.display="none"; if(cell){cell.classList.add("used"); cell.onclick=null;}}
</script>

</body>
</html>
